name: afterhours
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: afterhours
      POSTGRES_USER: afterhours_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Run pnpm setup first}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - afterhours-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U afterhours_owner -d afterhours']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  afterhours-postgres:
